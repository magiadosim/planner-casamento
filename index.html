<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Planner de Casamento | A Magia do Sim</title>
  <meta name="description" content="Seu planejamento de casamento em um só lugar.">
  <style>
    :root{--cream:#f6f1e8;--olive:#5f6547;--brown:#5a4535;--gold:#b79a63}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);font-family:Georgia,serif;color:var(--brown);padding:24px}
    main{max-width:760px;text-align:center;background:#fffdf8;border:1px solid rgba(183,154,99,.35);border-radius:24px;padding:48px 28px;box-shadow:0 18px 50px rgba(90,69,53,.08)}
    .eyebrow{font:600 12px/1.4 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--olive)}
    h1{font-size:clamp(36px,7vw,64px);font-weight:400;margin:14px 0}
    p{font:400 17px/1.7 Arial,sans-serif;max-width:560px;margin:0 auto;color:#6d625a}
    .tag{display:inline-block;margin-top:26px;padding:10px 16px;border-radius:999px;background:#eef0e6;color:var(--olive);font:600 13px Arial,sans-serif}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A Magia do Sim</div>
    <h1>Planner de Casamento</h1>
    <p>Um novo espaço para organizar cada etapa do casamento em um só lugar. Este projeto está sendo preparado como uma plataforma independente para os noivos.</p>
    <div class="tag">Novo projeto em construção</div>
  </main>
</body>
</html>
